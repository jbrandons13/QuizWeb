version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gradproject2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localhost
      POSTGRES_DB: finalproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quizweb-network

  mongodb:
    image: mongo:latest
    container_name: gradproject2-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quizweb-network

  redis:
    image: redis:latest
    container_name: gradproject2-redis
    ports:
      - "6379:6379"
    networks:
      - quizweb-network

  backend:
    build: ./backend
    container_name: gradproject2-backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - mongodb
      - redis
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=localhost
      - DB_NAME=finalproject
      - MONGODB_URI=mongodb://mongodb:27017/Project
      - JWT_SECRET=100
      - PORT=3000
    networks:
      - quizweb-network

  frontend:
    build: ./frontend
    container_name: gradproject2-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quizweb-network

volumes:
  postgres_data:
  mongo_data:

networks:
  quizweb-network:
    driver: bridge
