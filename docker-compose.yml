version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: gradproject2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localhost
      POSTGRES_DB: finalproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    container_name: gradproject2-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: gradproject2-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data:
